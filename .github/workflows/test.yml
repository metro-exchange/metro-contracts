name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/xmetro
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1

      - name: Show Forge version
        run: forge --version

      - name: Install dependencies
        run: |
          forge install foundry-rs/forge-std@v1.12.0
          forge install OpenZeppelin/openzeppelin-contracts@v5.5.0

      - name: Run Forge fmt
        run: |
          forge fmt --check \
            src/xMETRO.sol \
            src/ThorMigrationEscrow.sol \
            src/XMetroCoreLogic.sol \
            src/XMetroDeFiAdapter.sol \
            src/interfaces \
            script/DeFiAdapterScriptBase.sol \
            script/Deploy.s.sol \
            script/UpgradeDeFiAdapter.s.sol \
            script/ReplaceDeFiAdapter.s.sol \
            test/adapter/XMetroDeFiAdapter.flows.t.sol \
            test/adapter/XMetroDeFiAdapter.fuzz.t.sol \
            test/adapter/XMetroDeFiAdapter.invariant.t.sol \
            test/adapter/XMetroDeFiAdapter.uups.t.sol \
            test/adapter/XMetroDeFiAdapterV2.sol \
            test/core/XMetroSystem.integration.t.sol \
            test/fork-v2/mainnet/AdapterLifecycle.t.sol \
            test/fork-v2/mainnet/CommissionNetPaths.t.sol \
            test/fork-v2/mainnet/CrossSourcePaths.t.sol \
            test/fork-v2/mainnet/OneInchSwap.t.sol \
            test/fork-v2/mainnet/SwapRoutes.t.sol \
            test/core/XMetroCore.adapter.invariant.t.sol \
            test/core/XMetroCore.adapter.t.sol \
            test/deployment/DeployScript.t.sol \
            test/fork-v2/XMetroForkBase.sol \
            test/fork-v2/mainnet/AutoCompound.t.sol \
            test/fork-v2/mainnet/DeploymentGovernance.t.sol \
            test/fork-v2/mainnet/ContributorVesting.t.sol \
            test/fork-v2/mainnet/MigrationExit.t.sol \
            test/fork-v2/mainnet/TokenStakeRewards.t.sol \
            test/fork-v2/mainnet/YThorRewardWeight.t.sol \
            test/fuzz/ThorMigrationEscrow.fuzz.t.sol \
            test/fuzz/xMETRO.fuzz.t.sol \
            test/invariant/xMETRO.invariant.t.sol \
            test/invariant/MetroToken.invariant.t.sol \
            test/mock/XChainAndCore.t.sol \
            test/unit/ThorMigrationEscrow.unit.t.sol \
            test/unit/YThorWeight.integration.t.sol \
            test/unit/xMETRO.unit.t.sol \
            script/VerifyDeployment.s.sol \
            src/RewardDistributor.sol \
            src/metro.sol \
            test/fork-v2/mainnet/CommissionRouting.t.sol \
            test/fuzz/MetroToken.fuzz.t.sol \
            test/invariant/RewardDistributor.invariant.t.sol \
            test/mocks/MaliciousERC20.sol \
            test/unit/MetroToken.t.sol \
            test/unit/RewardDistributor.t.sol \
            src/MetroDistributorBase.sol \
            src/MetroDistributorV1.sol \
            src/MetroDistributorV2.sol \
            script/DeployMetroDistributor.s.sol \
            test/mocks/MockRateLimitedForwarder.sol \
            test/mocks/MetroDistributorV2Harness.sol \
            test/mocks/MetroDistributorFixture.sol \
            test/unit/MetroDistributorV1.t.sol \
            test/unit/MetroDistributorV2.t.sol \
            test/fuzz/MetroDistributor.fuzz.t.sol \
            test/invariant/MetroDistributor.invariant.t.sol \
            test/deployment/DeployMetroDistributor.t.sol

      - name: Build production xMETRO artifact
        run: FOUNDRY_PROFILE=core forge build --sizes

      - name: Build production Adapter artifact
        run: FOUNDRY_PROFILE=adapter forge build --sizes

      - name: Compile Ethereum fork tests
        run: FOUNDRY_PROFILE=fork-v2 forge build

      - name: Run legacy business regression
        run: FOUNDRY_PROFILE=regression forge test -vv

      - name: Run Core tests
        run: FOUNDRY_PROFILE=core forge test -vv

      - name: Run Adapter tests
        run: FOUNDRY_PROFILE=adapter forge test -vv

      - name: Build commission artifacts for the stack deploy
        working-directory: packages/commission
        run: |
          forge install foundry-rs/forge-std@v1.16.2
          forge install OpenZeppelin/openzeppelin-contracts@v5.6.1
          forge build

      - name: Run deployment-script tests
        run: FOUNDRY_PROFILE=deployment-test forge test -vv

      - name: Build short-timer testbed artifacts
        run: node script/base-qa/build-qa-core.mjs

      - name: Check MetroDistributor ABI exports
        run: |
          for contract in MetroDistributorV1 MetroDistributorV2; do
            diff <(FOUNDRY_PROFILE=regression forge inspect "$contract" abi --json | jq -S .) \
              <(jq -S . "integration/abi/$contract.json")
          done

      - name: Check integration example syntax
        run: |
          node --check integration/examples/user-actions.mjs
          node --check integration/examples/backend-actions.mjs
          node --check script/run-mainnet-fork-gas.mjs
          for script in script/base-qa/*.mjs; do node --check "$script"; done

  commission:
    name: Commission contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/commission
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1

      - name: Install dependencies
        run: |
          forge install foundry-rs/forge-std@v1.16.2
          forge install OpenZeppelin/openzeppelin-contracts@v5.6.1

      - name: Build
        run: forge build --sizes

      - name: Run tests
        run: forge test -vv
