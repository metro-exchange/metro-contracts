name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Release artifacts and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0

      - name: Show Forge version
        run: forge --version

      - name: Install dependencies
        run: |
          forge install foundry-rs/forge-std@v1.12.0
          forge install OpenZeppelin/openzeppelin-contracts@v5.5.0

      - name: Run Forge fmt
        run: |
          forge fmt --check \
            src/xMETRO.sol \
            src/XMetroCoreLogic.sol \
            src/XMetroDeFiAdapter.sol \
            src/interfaces \
            script/DeFiAdapterScriptBase.sol \
            script/Deploy.s.sol \
            script/UpgradeDeFiAdapter.s.sol \
            script/ReplaceDeFiAdapter.s.sol

      - name: Build production xMETRO artifact
        run: FOUNDRY_PROFILE=core forge build --sizes

      - name: Build production Adapter artifact
        run: FOUNDRY_PROFILE=adapter forge build --sizes

      - name: Compile Ethereum fork tests
        run: FOUNDRY_PROFILE=fork-v2 forge build

      - name: Run legacy business regression
        run: FOUNDRY_PROFILE=regression forge test -vv

      - name: Run Core tests
        run: FOUNDRY_PROFILE=core forge test -vv

      - name: Run Adapter tests
        run: FOUNDRY_PROFILE=adapter forge test -vv

      - name: Run deployment-script tests
        run: FOUNDRY_PROFILE=deployment-test forge test -vv
